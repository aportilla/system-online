<!-- Meteors window, copied at each open (windows.ts), which runs the game on
     its screen. -->
<!-- Fixed size, 322 × 260: the screen is the whole body, 320 × 240 (SCREEN in
     field.ts), plus the 18px title bar and the 1px borders. The canvas is one
     canvas px per system px, magnified pixelated by its own style, not the
     site's CSS; its container's box is whole device px, so the magnification
     is exact, as vf-img's is for raster art. The container takes the focus,
     so the window manager moves it there on open and the keys reach the
     game. -->
<vf-window
  data-window="game"
  heading="Meteors"
  closable
  movable
  outline-drag
  width="322"
  height="260"
>
  <vf-container
    class="meteors-screen"
    width="320"
    height="240"
    tabindex="0"
    role="application"
    aria-label="Meteors"
  >
    <canvas
      width="320"
      height="240"
      fill-width
      fill-height
      style="display: block; image-rendering: pixelated"
    ></canvas>
  </vf-container>
</vf-window>
