<!-- Meteors window, copied at each open (windows.ts), which runs the game on
     its screen. -->
<!-- Fixed size, 322 × 260: the screen is the whole body, 320 × 240 (SCREEN in
     game.ts), plus the 18px title bar and the 1px borders. The canvas is one
     canvas px per system px; its container holds it on the device grid and
     desktop.css magnifies it. The container takes the focus, so the window
     manager moves it there on open and the keys reach the game. -->
<vf-window
  data-window="game"
  heading="Meteors"
  closable
  movable
  outline-drag
  width="322"
  height="260"
>
  <vf-container
    class="meteors-screen"
    width="320"
    height="240"
    tabindex="0"
    role="application"
    aria-label="Meteors"
  >
    <canvas width="320" height="240" fill-width fill-height></canvas>
  </vf-container>
</vf-window>
